name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --noconsole --onefile --name "jrz-Accessory-Tool" src/jrz_accessorys_tool.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrz-Accessory-Tool
          path: dist/jrz-Accessory-Tool.exe

      - name: Attach exe to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jrz-Accessory-Tool.exe
